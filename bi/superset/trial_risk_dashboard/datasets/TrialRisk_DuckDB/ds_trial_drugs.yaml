sql: "SELECT\n  s.nct_id, s.brief_title, s.is_open, s.overall_status, s.ctgov_url,\n  '<a href=\"' || s.ctgov_url || '\" target=\"\
  _blank\">' || s.nct_id || '</a>' AS ctgov_link,\n  d.canonical_name, d.has_fda_data\nFROM marts.bridge_study_drug b\nJOIN\
  \ marts.dim_study s ON s.nct_id = b.nct_id\nJOIN marts.dim_drug d ON d.drug_key = b.drug_key"
