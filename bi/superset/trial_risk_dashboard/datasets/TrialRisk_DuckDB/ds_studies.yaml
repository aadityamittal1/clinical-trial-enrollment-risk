schema: marts
sql: "SELECT\n  s.nct_id, s.brief_title, s.phase, s.overall_status, s.is_open, s.lead_sponsor_class,\n  s.start_year, s.enrollment_count,\
  \ s.ctgov_url,\n  '<a href=\"' || s.ctgov_url || '\" target=\"_blank\">' || s.nct_id || '</a>' AS ctgov_link,\n  f.condition_category,\n\
  \  r.risk_score, r.model_version, r.scored_at,\n  r.top_driver_1, r.top_driver_2, r.top_driver_3,\n  r.top_driver_1_shap,\
  \ r.top_driver_2_shap, r.top_driver_3_shap, r.shap_values\nFROM marts.dim_study s\nLEFT JOIN marts.ml_features f ON f.nct_id\
  \ = s.nct_id\nLEFT JOIN marts.ml_scores_latest r ON r.nct_id = s.nct_id"
