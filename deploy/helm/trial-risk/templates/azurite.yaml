{{- if .Values.azurite.enabled }}
{{- if .Values.azurite.persistence.enabled }}
# Blob data on a PVC so an Azurite restart keeps MLflow artifacts (the MLflow
# registry is on its own PVC and would otherwise point at lost artifacts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.azurite.persistence.claimName }}
  labels:
    {{- include "trial-risk.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.azurite.persistence.storageClassName }}
  storageClassName: {{ .Values.azurite.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.azurite.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-azurite
  labels:
    app.kubernetes.io/name: azurite
    {{- include "trial-risk.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.azurite.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: azurite
          image: {{ include "trial-risk.image" .Values.images.azurite }}
          command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
          env:
            # "<account>:<base64 key>", generated by deploy/local-up.sh and stored in the Secret.
            - name: AZURITE_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: AZURITE_ACCOUNTS
          ports:
            - name: blob
              containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: blob
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.azurite.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.azurite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.azurite.persistence.claimName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-azurite
  labels:
    app.kubernetes.io/name: azurite
    {{- include "trial-risk.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: azurite
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: blob
      port: 10000
      targetPort: blob
{{- end }}
