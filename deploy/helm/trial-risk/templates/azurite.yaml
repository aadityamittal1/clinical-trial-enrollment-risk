{{- if .Values.azurite.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-azurite
  labels:
    app.kubernetes.io/name: azurite
    {{- include "trial-risk.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: azurite
          image: {{ include "trial-risk.image" .Values.images.azurite }}
          command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
          env:
            # "<account>:<base64 key>", generated by deploy/local-up.sh and stored in the Secret.
            - name: AZURITE_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: AZURITE_ACCOUNTS
          ports:
            - name: blob
              containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: blob
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.azurite.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-azurite
  labels:
    app.kubernetes.io/name: azurite
    {{- include "trial-risk.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: azurite
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: blob
      port: 10000
      targetPort: blob
{{- end }}
