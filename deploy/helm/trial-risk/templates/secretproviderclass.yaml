{{- if .Values.keyVault.enabled }}
# Azure Key Vault via the Secrets Store CSI driver (AKS add-on). The driver
# syncs the objects into the Secret named by secrets.name while a pod that
# mounts this class is running (serving and mlflow do).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-kv
  labels:
    {{- include "trial-risk.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
        {{- end }}
        {{- if .Values.keyVault.openfdaApiKey }}
        - |
          objectName: openfda-api-key
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.name }}
      type: Opaque
      data:
        {{- range .Values.keyVault.secrets }}
        - objectName: {{ .objectName }}
          key: {{ .key }}
        {{- end }}
        {{- if .Values.keyVault.openfdaApiKey }}
        - objectName: openfda-api-key
          key: OPENFDA_API_KEY
        {{- end }}
{{- end }}
