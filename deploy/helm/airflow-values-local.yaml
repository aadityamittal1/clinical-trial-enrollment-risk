# Official apache-airflow chart (release "airflow", namespace trial-risk), local kind.
#   helm repo add apache-airflow https://airflow.apache.org
#   helm upgrade --install airflow apache-airflow/airflow --version 1.15.0 \
#     -n trial-risk -f deploy/helm/airflow-values-local.yaml
#
# DAG delivery decision: DAGs are BAKED INTO a derived Airflow image
# (deploy/docker/airflow.Dockerfile copies dags/ to /opt/airflow/dags). No
# git-sync, so kind needs no network access to a Git remote and no credentials.
# Trade-off: a DAG change requires rebuilding and reloading the image
# (deploy/local-up.sh does this on every run).
images:
  airflow:
    repository: trial-risk-airflow
    tag: local
    pullPolicy: Never

executor: LocalExecutor

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# Airflow metadata DB: the chart's bundled PostgreSQL (local only).
postgresql:
  enabled: true

# Disable components not needed with LocalExecutor.
redis:
  enabled: false
triggerer:
  enabled: false
statsd:
  enabled: false
flower:
  enabled: false

webserver:
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
        nodePort: 30080
  # Default chart user is created by the chart's job; change it after first login.
  defaultUser:
    enabled: true

# Names the DAGs read to build KubernetesPodOperator tasks.
env:
  - name: TRIAL_RISK_NAMESPACE
    value: trial-risk
  - name: TRIAL_RISK_PIPELINE_IMAGE
    value: trial-risk-pipeline:local
  - name: TRIAL_RISK_IMAGE_PULL_POLICY
    value: Never
  - name: TRIAL_RISK_CONFIGMAP
    value: trial-risk-env
  - name: TRIAL_RISK_SECRET
    value: trial-risk-secrets
  - name: TRIAL_RISK_DUCKDB_PVC
    value: trial-risk-warehouse
  - name: TRIAL_RISK_DUCKDB_MOUNT
    value: /data
