kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: trial-risk
nodes:
  - role: control-plane
    extraPortMappings:
      # Airflow webserver (NodePort 30080) and scoring API (NodePort 30081).
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30081
        hostPort: 8000
        protocol: TCP
