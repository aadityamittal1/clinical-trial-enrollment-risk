# STATIC TIER: not executed by the authors.
name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  push-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/pipeline.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trial-risk-pipeline:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/trial-risk-pipeline:latest
      - name: Push serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/serving.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trial-risk-serving:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/trial-risk-serving:latest

  deploy-aks:
    needs: push-images
    if: ${{ vars.CLOUD_MODE_UP == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      - name: Helm upgrade
        run: |
          helm upgrade --install trial-risk deploy/helm/trial-risk \
            --namespace trial-risk --create-namespace \
            -f deploy/helm/trial-risk/values-aks.yaml \
            --set pipelineImage.tag=${{ github.sha }} \
            --set servingImage.tag=${{ github.sha }}
